spring.application.name=wasimikuna
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=wasimikuna
spring.datasource.password=wasimikuna
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Temporarily changed to none to avoid schema validation during startup testing
spring.jpa.hibernate.ddl-auto=none

# Disable query validation on startup
spring.jpa.properties.hibernate.query.startup_check=false
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Habilitar logs para debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE

server.port=8080